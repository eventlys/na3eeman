name: Flutter CI/CD
on:
  push:
    branches: [ main, develop, stg ]
  pull_request:
    branches: [ main, develop, stg ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Install Dependencies
        run: flutter pub get

      - name: Format
        run: dart format --set-exit-if-changed .

      - name: Inject Production Env File
        run: |
          cat << EOF > .env
          API_BASE_URL=${{ vars.API_BASE_URL }}
          ENVIRONMENT=${{ vars.ENVIRONMENT }}
          DEBUG_BANNER=${{ vars.DEBUG_BANNER }}
          LOGGING_ENABLED=${{ vars.LOGGING_ENABLED }}
          WEB_APP_URL=${{ vars.WEB_APP_URL }}
          ADMIN_EMAIL=${{ vars.ADMIN_EMAIL }}
          SUPPORT_EMAIL=${{ vars.SUPPORT_EMAIL }}
          APP_NAME=${{ vars.APP_NAME }}
          GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
          FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID=${{ vars.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID=${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET=${{ vars.FIREBASE_STORAGE_BUCKET }}
          CLOUDFLARE_ANALYTICS_TOKEN=${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CLOUDFLARE_TURNSTILE_SITE_KEY=${{ secrets.CLOUDFLARE_TURNSTILE_SITE_KEY }}
          STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          TWILIO_VERIFY_SERVICE_SID=${{ secrets.TWILIO_VERIFY_SERVICE_SID }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          APPLE_CLIENT_ID=${{ secrets.APPLE_CLIENT_ID }}
          EOF
          touch .env.dev

      - name: Analyze
        run: |
          dart analyze
          flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          
      - name: Security Scan (Trivy FS)
        run: trivy fs --exit-code 1 --severity HIGH,CRITICAL --format table .

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=na3eeman
            -Dsonar.projectName="Na3eeman"
            -Dsonar.qualitygate.wait=false

      - name: Build Android AppBundle
        run: flutter build appbundle --release --dart-define=FLAVOR=prod

      - name: Build Android APK
        run: flutter build apk --release --dart-define=FLAVOR=prod
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/flutter-apk/*.apk

  deploy_android:
    name: Deploy Android to GCP Storage
    needs: build_and_test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stg'
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: build/app/outputs/

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.SA_EMAIL }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload APK to GCS
        run: |
          # Extract version from pubspec.yaml and replace + with _ for URL safety
          APP_VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | tr -d '\r' | tr '+' '_')
          DEST_NAME="na3eman.${APP_VERSION}.apk"
          
          # The artifact download structure might have nested directories
          APK_PATH=$(find build/app/outputs -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            gcloud storage cp "$APK_PATH" "gs://na3eemn-mobile-apps/android/latest/${DEST_NAME}"
            gcloud storage objects update "gs://na3eemn-mobile-apps/android/latest/${DEST_NAME}" --add-acl-grant=entity=AllUsers,role=READER || true
          else
            echo "No APK found!"
            exit 1
          fi
