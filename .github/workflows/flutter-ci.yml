name: Flutter CI/CD
on:
  push:
    branches: [ main, develop, stg ]
  pull_request:
    branches: [ main, develop, stg ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.0'
          cache: true
      
      - name: Create Dummy .env
        run: |
          touch .env .env.dev .env.stg .env.prod
          cp .env.example .env || true
        
      - name: Install Dependencies
        run: flutter pub get

      - name: Format
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: |
          dart analyze
          flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          
      - name: Security Scan (Trivy FS)
        run: trivy fs --exit-code 1 --severity HIGH,CRITICAL --format table .

      # - name: SonarQube Scan
      #   uses: sonarsource/sonarqube-scan-action@master
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #     SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      #   with:
      #     projectBaseDir: .
      #     args: >
      #       -Dsonar.projectKey=na3eeman
      #       -Dsonar.projectName="Na3eeman"
      #       -Dsonar.qualitygate.wait=false

      - name: Build Android AppBundle
        run: >
          flutter build appbundle --release 
          --dart-define=FLAVOR=prod 
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }} 
          --dart-define=ENVIRONMENT=${{ vars.ENVIRONMENT }} 
          --dart-define=DEBUG_BANNER=${{ vars.DEBUG_BANNER }} 
          --dart-define=LOGGING_ENABLED=${{ vars.LOGGING_ENABLED }} 
          --dart-define=WEB_APP_URL=${{ vars.WEB_APP_URL }} 
          --dart-define=ADMIN_EMAIL=${{ vars.ADMIN_EMAIL }} 
          --dart-define=SUPPORT_EMAIL=${{ vars.SUPPORT_EMAIL }} 
          --dart-define=APP_NAME="${{ vars.APP_NAME }}" 
          --dart-define=GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }} 
          --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} 
          --dart-define=FIREBASE_APP_ID=${{ vars.FIREBASE_APP_ID }} 
          --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ vars.FIREBASE_MESSAGING_SENDER_ID }} 
          --dart-define=FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }} 
          --dart-define=FIREBASE_STORAGE_BUCKET=${{ vars.FIREBASE_STORAGE_BUCKET }} 
          --dart-define=CLOUDFLARE_ANALYTICS_TOKEN=${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }} 
          --dart-define=CLOUDFLARE_TURNSTILE_SITE_KEY=${{ secrets.CLOUDFLARE_TURNSTILE_SITE_KEY }} 
          --dart-define=STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }} 
          --dart-define=TWILIO_VERIFY_SERVICE_SID=${{ secrets.TWILIO_VERIFY_SERVICE_SID }} 
          --dart-define=GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} 
          --dart-define=APPLE_CLIENT_ID=${{ secrets.APPLE_CLIENT_ID }}

      - name: Build Android APK
        run: >
          flutter build apk --release 
          --dart-define=FLAVOR=prod 
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }} 
          --dart-define=ENVIRONMENT=${{ vars.ENVIRONMENT }} 
          --dart-define=DEBUG_BANNER=${{ vars.DEBUG_BANNER }} 
          --dart-define=LOGGING_ENABLED=${{ vars.LOGGING_ENABLED }} 
          --dart-define=WEB_APP_URL=${{ vars.WEB_APP_URL }} 
          --dart-define=ADMIN_EMAIL=${{ vars.ADMIN_EMAIL }} 
          --dart-define=SUPPORT_EMAIL=${{ vars.SUPPORT_EMAIL }} 
          --dart-define=APP_NAME="${{ vars.APP_NAME }}" 
          --dart-define=GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }} 
          --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} 
          --dart-define=FIREBASE_APP_ID=${{ vars.FIREBASE_APP_ID }} 
          --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ vars.FIREBASE_MESSAGING_SENDER_ID }} 
          --dart-define=FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }} 
          --dart-define=FIREBASE_STORAGE_BUCKET=${{ vars.FIREBASE_STORAGE_BUCKET }} 
          --dart-define=CLOUDFLARE_ANALYTICS_TOKEN=${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }} 
          --dart-define=CLOUDFLARE_TURNSTILE_SITE_KEY=${{ secrets.CLOUDFLARE_TURNSTILE_SITE_KEY }} 
          --dart-define=STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }} 
          --dart-define=TWILIO_VERIFY_SERVICE_SID=${{ secrets.TWILIO_VERIFY_SERVICE_SID }} 
          --dart-define=GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} 
          --dart-define=APPLE_CLIENT_ID=${{ secrets.APPLE_CLIENT_ID }}


      - name: Authenticate to Google Cloud
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stg'
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.SA_EMAIL }}'

      - name: Fetch Play Store Credentials
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stg'
        uses: google-github-actions/get-secretmanager-secrets@v2
        id: secrets
        with:
          secrets: |-
            play_store_key:${{ vars.GCP_PROJECT_ID }}/${{ vars.PLAY_STORE_SECRET_NAME }}

      - name: Determine AAB Path
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stg'
        id: aab_path
        run: |
          if [ -n "${{ vars.PLAY_STORE_ARTIFACT_PATH }}" ]; then
            echo "path=${{ vars.PLAY_STORE_ARTIFACT_PATH }}" >> $GITHUB_OUTPUT
          else
            echo "path=$(find build/app/outputs -name "*.aab" | head -n 1)" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Play Store
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stg'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ steps.secrets.outputs.play_store_key }}
          packageName: ${{ vars.PLAY_STORE_PACKAGE_NAME }}
          releaseFiles: ${{ steps.aab_path.outputs.path }}
          track: ${{ vars.PLAY_STORE_TRACK || 'closed' }}
          status: ${{ vars.PLAY_STORE_STATUS || 'completed' }}
