name: Flutter CI/CD
on:
  push:
    branches: [ main, develop, stg ]
  pull_request:
    branches: [ main, develop, stg ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Install Dependencies
        run: flutter pub get

      - name: Format
        run: dart format --set-exit-if-changed .

      - name: Create Dummy Env Files
        run: touch .env .env.dev

      - name: Analyze
        run: |
          dart analyze
          flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          
      - name: Security Scan (Trivy FS)
        run: trivy fs --exit-code 1 --severity HIGH,CRITICAL --format table .

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=na3eeman
            -Dsonar.projectName="Na3eeman"
            -Dsonar.qualitygate.wait=false

      - name: Build Android AppBundle
        run: flutter build appbundle --release

      - name: Build Android APK
        run: flutter build apk --release
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/flutter-apk/*.apk

  deploy_android:
    name: Deploy Android to GCP Storage
    needs: build_and_test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stg'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: build/app/outputs/

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload APK to GCS
        run: |
          # The artifact download structure might have nested directories
          APK_PATH=$(find build/app/outputs -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            gcloud storage cp "$APK_PATH" gs://na3eemn-mobile-apps/android/latest/app.apk
            gcloud storage objects update gs://na3eemn-mobile-apps/android/latest/app.apk --add-acl-grant=entity=AllUsers,role=READER || true
          else
            echo "No APK found!"
            exit 1
          fi
